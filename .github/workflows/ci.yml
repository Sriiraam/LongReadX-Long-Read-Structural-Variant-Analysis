name: LongReadX CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lightweight dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas pytest streamlit plotly

      - name: Compile Python
        run: |
          python -m compileall scripts streamlit_app

      - name: Repository tests
        run: |
          pytest -q tests/test_repository.py

      - name: Validate Streamlit import
        run: |
          python -m py_compile streamlit_app/app.py

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Nextflow
        run: |
          curl -s https://get.nextflow.io | bash
          sudo mv nextflow /usr/local/bin/
          nextflow -version

      - name: Validate Nextflow configuration
        run: |
          nextflow config >/dev/null
          echo "Nextflow config: PASS"

      - name: Check Dockerfile
        run: |
          test -f docker/Dockerfile
          echo "Dockerfile: PASS"
